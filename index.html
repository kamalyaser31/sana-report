<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية سنا - نظام التقارير اليومية</title>
    <link rel="stylesheet" href="styles.css">
    <script src="html2pdf.bundle.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

<main class="container">
    <header class="app-header">
        <div>
            <h1>أكاديمية سنا لتعليم القرآن الكريم</h1>
            <p style="font-size:0.85rem;color:var(--text-muted)">نظام إعداد وتوثيق تقارير الحلقات اليومية</p>
        </div>
        <div class="header-controls">
            <button type="button" id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline btn-sm" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>
            <button type="button" onclick="rolloverHomework()" class="btn btn-outline btn-sm" style="border-color:var(--primary);color:var(--primary);" aria-label="تدوير الواجبات لجلسة جديدة">تدوير الواجبات</button>
            <button type="button" onclick="clearAll()" class="btn btn-danger btn-sm" aria-label="مسح التقرير كاملاً">مسح الكل</button>
        </div>
    </header>

    <section class="settings-section" aria-label="بيانات الحلقة">
        <div class="settings-grid">
            <div class="form-group full-width">
                <label for="reportDate">تاريخ اليوم:</label>
                <input type="text" id="reportDate" aria-label="تاريخ التقرير">
            </div>
            <div class="form-group">
                <label for="halaType">فترة الحلقة:</label>
                <select id="halaType" aria-label="فترة الحلقة">
                    <option value="صباحية">صباحية</option>
                    <option value="مسائية">مسائية</option>
                </select>
            </div>
            <div class="form-group">
                <label for="halaNum">رقم الحلقة:</label>
                <input type="text" id="halaNum" placeholder="رقم الحلقة" aria-label="رقم الحلقة">
            </div>
            <div class="form-group">
                <label for="halaDuration">مدة الحلقة:</label>
                <input type="text" id="halaDuration" placeholder="المدة" aria-label="مدة الحلقة">
            </div>
            <div class="form-group">
                <label for="teacherName">اسم المعلم:</label>
                <input type="text" id="teacherName" placeholder="اسم المعلم" aria-label="اسم المعلم">
            </div>
        </div>
    </section>

    <section class="stats-bar" aria-label="إحصائيات التقرير">
        <div>
            <span>إجمالي الطلاب: <strong id="totalCount">0</strong></span>
            <span style="margin-right:8px;font-size:0.85rem;opacity:0.9;">(ذكور: <strong id="maleCount">0</strong> | إناث: <strong id="femaleCount">0</strong>)</span>
        </div>
        <button type="button" id="expandAllBtn" onclick="toggleAll()" class="btn btn-outline btn-sm" style="color:inherit;border-color:currentColor;" aria-label="طي أو توسيع كافة بطاقات الطلاب">طي الكل</button>
    </section>

    <section id="studentsList" class="students-container" aria-label="بطاقات الطلاب"></section>
</main>

<footer class="action-bar-container" aria-label="شريط الإجراءات">
    <div class="action-bar-inner">
        <button type="button" onclick="addStudent()" class="btn btn-success" aria-label="إضافة طالب جديد">+ إضافة طالب</button>
        <button type="button" onclick="copyAll()" class="btn btn-primary" aria-label="نسخ التقرير الكلي">نسخ التقرير الكلي</button>
        <button type="button" onclick="exportPDF()" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary);" aria-label="تصدير ملف PDF">تصدير PDF</button>
    </div>
</footer>

</body>
</html>
