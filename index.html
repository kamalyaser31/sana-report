<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية سنا - نظام التقارير اليومية</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#006655">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقارير سنا">
    <link rel="stylesheet" href="styles.css">
    <script src="html2pdf.bundle.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

<main class="container">
    <header class="app-header">
        <div>
            <h1>أكاديمية سنا لتعليم القرآن الكريم</h1>
            <p style="font-size:0.85rem;color:var(--text-muted)">نظام إعداد وتوثيق تقارير الحلقات اليومية المرتبط بالاستمارة السحابية</p>
        </div>
        <div class="header-controls">
            <button type="button" id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline btn-sm" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>
            <button type="button" onclick="clearAll()" class="btn btn-danger btn-sm" aria-label="مسح التقرير كاملاً">مسح الكل</button>
        </div>
    </header>

    <!-- بيانات الحلقة وإعدادات التقرير عبر عنصر details و summary الأصيل -->
    <details class="settings-details" id="settingsDetails" open aria-label="بيانات الحلقة وإعدادات التقرير">
        <summary class="settings-summary-bar">
            <div class="summary-content">
                <span class="summary-icon">⚙</span>
                <strong>بيانات الحلقة</strong>
                <span class="summary-badge" id="settingsBadge">محمد نبيل • أطفال • صباحية • 1 ساعة</span>
            </div>
        </summary>
        <div class="settings-details-body">
            <div class="card-fields-grid">
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <label for="reportDate">تاريخ التقرير:</label>
                        <div style="display:flex;gap:4px;">
                            <button type="button" onclick="setDatePreset('today')" class="btn btn-outline btn-sm" style="padding:2px 6px;min-height:24px;font-size:0.75rem;" aria-label="تعيين تاريخ اليوم">اليوم</button>
                            <button type="button" onclick="setDatePreset('yesterday')" class="btn btn-outline btn-sm" style="padding:2px 6px;min-height:24px;font-size:0.75rem;" aria-label="تعيين تاريخ الأمس">الأمس</button>
                        </div>
                    </div>
                    <input type="text" id="reportDate" aria-label="تاريخ التقرير">
                </div>
                <div class="form-group">
                    <label for="teacherName">اسم المعلم:</label>
                    <select id="teacherName" aria-label="اسم المعلم">
                        <option value="محمد نبيل">محمد نبيل</option>
                        <option value="أسماء علي">أسماء علي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentCategory">فئة الطلاب:</label>
                    <select id="studentCategory" aria-label="فئة الطلاب">
                        <option value="أطفال">أطفال</option>
                        <option value="كبار">كبار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="halaType">نوع الحلقة / الفترة:</label>
                    <select id="halaType" aria-label="نوع الحلقة">
                        <option value="صباحية">صباحية</option>
                        <option value="مسائية">مسائية</option>
                        <option value="تجويد">تجويد</option>
                        <option value="إضافية">إضافية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="durationHours">الساعات:</label>
                    <input type="number" id="durationHours" min="0" max="24" value="1" placeholder="ساعات" aria-label="عدد الساعات">
                </div>
                <div class="form-group">
                    <label for="durationMinutes">الدقائق:</label>
                    <input type="number" id="durationMinutes" min="0" max="59" step="5" value="0" placeholder="دقائق" aria-label="عدد الدقائق">
                </div>
                <div class="form-group">
                    <label for="halaNum">رقم الحلقة (اختياري):</label>
                    <input type="text" id="halaNum" placeholder="رقم الحلقة" aria-label="رقم الحلقة">
                </div>
                <div class="form-group full-width">
                    <label for="adminNotes">ملاحظات خاصة للإدارة (تُرسل للاستمارة فقط):</label>
                    <input type="text" id="adminNotes" placeholder="تنبيه أو إشعار خاص للإدارة دون أن يظهر في تقرير الطلاب" aria-label="ملاحظات خاصة للإدارة">
                </div>
            </div>
        </div>
    </details>

    <section class="stats-bar" aria-label="إحصائيات التقرير">
        <div>
            <span>إجمالي الطلاب: <strong id="totalCount">0</strong></span>
            <span style="margin-right:8px;font-size:0.85rem;opacity:0.9;">(ذكور: <strong id="maleCount">0</strong> | إناث: <strong id="femaleCount">0</strong>)</span>
        </div>
        <button type="button" id="expandAllBtn" onclick="toggleAll()" class="btn btn-outline btn-sm" style="color:inherit;border-color:currentColor;" aria-label="طي أو توسيع كافة بطاقات الطلاب">طي الكل</button>
    </section>

    <section id="studentsList" class="students-container" aria-label="بطاقات الطلاب"></section>
</main>

<footer class="action-bar-container" aria-label="شريط الإجراءات">
    <div class="action-bar-inner">
        <button type="button" onclick="addStudent()" class="btn btn-success" aria-label="إضافة طالب جديد">+ إضافة طالب</button>
        <button type="button" onclick="copyAll()" class="btn btn-primary" aria-label="نسخ التقرير الكلي">نسخ التقرير</button>
        <button type="button" onclick="exportPDF()" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary);" aria-label="تصدير ملف PDF">تصدير PDF</button>
        <button type="button" onclick="submitToGoogleForm()" class="btn btn-primary" style="background:#0284c7;" aria-label="فتح استمارة جوجل المعبأة مسبقاً لإرسال التقرير">إرسال للاستمارة ↗</button>
    </div>
</footer>

</body>
</html>
