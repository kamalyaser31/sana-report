<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية سنا - نظام التقارير اليومية</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <meta name="theme-color" content="#006655">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقارير سنا">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/html2pdf.bundle.min.js"></script>
    <script src="js/quran-data.js"></script>
    <script src="js/constants.js" defer></script>
    <script src="js/state.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/drafts.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/students.js" defer></script>
    <script src="js/report.js" defer></script>
    <script src="js/quran.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

<main class="container">
    <header class="app-header">
        <div>
            <h1>أكاديمية سنا لتعليم القرآن الكريم</h1>
            <p class="app-subtitle">توثيق ومتابعة تقارير الحلقات</p>
        </div>
        <div class="header-controls">
            <button type="button" onclick="openSettingsModal()" class="btn btn-outline btn-sm" aria-label="تخصيص الحقول">⚙️ تخصيص الحقول</button>
            <button type="button" id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline btn-sm" aria-label="الوضع الليلي">الوضع الليلي</button>
            <button type="button" onclick="clearAll()" class="btn btn-danger btn-sm" aria-label="مسح التقرير">مسح التقرير</button>
        </div>
    </header>

    <!-- بيانات الحلقة -->
    <details class="settings-details" id="settingsDetails" open aria-label="بيانات الحلقة">
        <summary class="settings-summary-bar">
            <div class="summary-content">
                <span class="summary-icon">⚙</span>
                <strong>بيانات الحلقة</strong>
                <span class="summary-badge" id="settingsBadge">محمد نبيل • أطفال • صباحية • 1 ساعة</span>
            </div>
        </summary>
        <div class="settings-details-body">
            <div class="card-fields-grid">
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <label for="reportDate">التاريخ:</label>
                        <div style="display:flex;gap:4px;">
                            <button type="button" onclick="setDatePreset('today')" class="btn btn-outline btn-xs" aria-label="اليوم">اليوم</button>
                            <button type="button" onclick="setDatePreset('yesterday')" class="btn btn-outline btn-xs" aria-label="الأمس">الأمس</button>
                        </div>
                    </div>
                    <input type="text" id="reportDate" aria-label="التاريخ">
                </div>
                <div class="form-group">
                    <label for="teacherName">المعلم:</label>
                    <select id="teacherName" aria-label="المعلم">
                        <option value="محمد نبيل">محمد نبيل</option>
                        <option value="أسماء علي">أسماء علي</option>
                        <option value="فاطمة إبراهيم">فاطمة إبراهيم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentCategory">الفئة:</label>
                    <select id="studentCategory" aria-label="الفئة">
                        <option value="أطفال">أطفال</option>
                        <option value="كبار">كبار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="halaType">الفترة:</label>
                    <select id="halaType" aria-label="الفترة">
                        <option value="صباحية">صباحية</option>
                        <option value="مسائية">مسائية</option>
                        <option value="تجويد">تجويد</option>
                        <option value="إضافية">إضافية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="durationHours">الساعات:</label>
                    <input type="number" id="durationHours" min="0" max="24" value="1" placeholder="ساعة" aria-label="الساعات">
                </div>
                <div class="form-group">
                    <label for="durationMinutes">الدقائق:</label>
                    <input type="number" id="durationMinutes" min="0" max="59" step="5" value="0" placeholder="دقيقة" aria-label="الدقائق">
                </div>
                <div class="form-group">
                    <label for="halaNum">رقم الحلقة:</label>
                    <input type="text" id="halaNum" placeholder="اختياري" aria-label="رقم الحلقة">
                </div>
                <div class="form-group full-width">
                    <label for="adminNotes">ملاحظات الإدارة:</label>
                    <input type="text" id="adminNotes" placeholder="ملاحظات للإدارة فقط" aria-label="ملاحظات الإدارة">
                </div>
            </div>
        </div>
    </details>

    <!-- اختيار المسودة الحالية -->
    <div class="draft-selector-row">
        <label for="draftSelect" class="draft-selector-label">المسودة:</label>
        <select id="draftSelect" class="draft-select-control" onchange="onDraftChange(this.value)" aria-label="المسودة الحالية"></select>
    </div>

    <section class="stats-bar" aria-label="إحصائيات التقرير">
        <div>
            <span>إجمالي الطلاب: <strong id="totalCount">0</strong></span>
            <span style="margin-right:8px;font-size:0.85rem;opacity:0.9;">(ذكور: <strong id="maleCount">0</strong> | إناث: <strong id="femaleCount">0</strong>)</span>
        </div>
        <button type="button" id="expandAllBtn" onclick="toggleAll()" class="btn btn-outline btn-sm" style="color:inherit;border-color:currentColor;" aria-label="طي الكل">طي الكل</button>
    </section>

    <section id="studentsList" class="students-container" aria-label="بطاقات الطلاب"></section>
</main>

<footer class="action-bar-container" aria-label="شريط الإجراءات">
    <div class="action-bar-inner">
        <button type="button" onclick="addStudent()" class="btn btn-success" aria-label="إضافة طالب">+ إضافة طالب</button>
        <button type="button" onclick="copyAll(event)" class="btn btn-primary" aria-label="نسخ التقرير">نسخ التقرير</button>
        <button type="button" onclick="exportPDF()" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary);" aria-label="تصدير PDF">تصدير PDF</button>
        <button type="button" onclick="submitToGoogleForm()" class="btn btn-primary" style="background:#0284c7;" aria-label="إرسال للاستمارة">إرسال للاستمارة ↗</button>
    </div>
</footer>

<!-- نافذة منتقي المصحف الشريف -->
<div id="quranModal" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="quranModalTitle">
    <div class="modal-box">
        <header class="modal-header">
            <h3 id="quranModalTitle">📖 المصحف الشريف</h3>
            <button type="button" class="modal-close-btn" onclick="closeQuranPicker()" aria-label="إغلاق">✕</button>
        </header>
        <div class="modal-tabs" role="tablist">
            <button type="button" class="tab-btn active" id="tabSurahBtn" role="tab" aria-selected="true" aria-controls="tabSurahContent" onclick="setQuranTab('surah')">السورة والآيات</button>
            <button type="button" class="tab-btn" id="tabPageBtn" role="tab" aria-selected="false" aria-controls="tabPageContent" onclick="setQuranTab('page')">الصفحات</button>
            <button type="button" class="tab-btn" id="tabJuzBtn" role="tab" aria-selected="false" aria-controls="tabJuzContent" onclick="setQuranTab('juz')">الأجزاء والأرباع</button>
        </div>
        <div class="modal-body">
            <!-- تبويب السورة والآيات -->
            <div id="tabSurahContent">
                <div class="form-group">
                    <label for="pickerSurahSelect">السورة:</label>
                    <select id="pickerSurahSelect" onchange="onSurahChange()"></select>
                </div>
                <div class="two-col-grid">
                    <div class="form-group">
                        <label for="pickerFromAyah">من آية:</label>
                        <input type="number" id="pickerFromAyah" min="1" value="1" oninput="updateQuranPreview()">
                    </div>
                    <div class="form-group">
                        <label for="pickerToAyah">إلى آية:</label>
                        <input type="number" id="pickerToAyah" min="1" value="10" oninput="updateQuranPreview()">
                    </div>
                </div>
                <div class="quick-chips">
                    <button type="button" class="chip-btn" onclick="setSurahRange('full')">كامل السورة</button>
                    <button type="button" class="chip-btn" onclick="setSurahRange('firstHalf')">النصف الأول</button>
                    <button type="button" class="chip-btn" onclick="setSurahRange('secondHalf')">النصف الثاني</button>
                    <button type="button" class="chip-btn" onclick="setSurahRange('first10')">أول ١٠ آيات</button>
                </div>
            </div>

            <!-- تبويب الصفحات -->
            <div id="tabPageContent" style="display:none;">
                <div class="two-col-grid">
                    <div class="form-group">
                        <label for="pickerFromPage">من صفحة:</label>
                        <input type="number" id="pickerFromPage" min="1" max="604" value="1" oninput="updateQuranPreview()">
                    </div>
                    <div class="form-group">
                        <label for="pickerToPage">إلى صفحة:</label>
                        <input type="number" id="pickerToPage" min="1" max="604" value="1" oninput="updateQuranPreview()">
                    </div>
                </div>
                <div id="pageSurahInfo" style="font-size:0.85rem;color:var(--primary);font-weight:bold;margin-top:4px;"></div>
                <div class="quick-chips">
                    <button type="button" class="chip-btn" onclick="setPageRange(1)">صفحة واحدة</button>
                    <button type="button" class="chip-btn" onclick="setPageRange(2)">وجهان (ورقة)</button>
                    <button type="button" class="chip-btn" onclick="setPageRange(5)">٥ صفحات</button>
                    <button type="button" class="chip-btn" onclick="setPageRange(10)">١٠ صفحات</button>
                </div>
            </div>

            <!-- تبويب الأجزاء والأرباع -->
            <div id="tabJuzContent" style="display:none;">
                <div class="form-group">
                    <label for="pickerJuzSelect">الجزء:</label>
                    <select id="pickerJuzSelect" onchange="onJuzChange()"></select>
                </div>
                <div class="form-group">
                    <label for="pickerRubSelect">الربع:</label>
                    <select id="pickerRubSelect" onchange="updateQuranPreview()"></select>
                </div>
            </div>

            <!-- المعاينة الحية -->
            <div class="picker-preview-box">
                <div class="picker-preview-label">النص الناتج:</div>
                <strong id="quranPreviewText" style="color:var(--primary);">...</strong>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" onclick="closeQuranPicker()" class="btn btn-outline btn-sm">إلغاء</button>
            <button type="button" onclick="insertQuranSelection()" class="btn btn-success btn-sm">إدراج ✓</button>
        </footer>
    </div>
</div>

<!-- نافذة إعدادات المعلم وتخصيص الحقول -->
<div id="settingsModal" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-box">
        <header class="modal-header">
            <h3 id="settingsModalTitle">⚙️ تخصيص الحقول</h3>
            <button type="button" class="modal-close-btn" onclick="closeSettingsModal()" aria-label="إغلاق">✕</button>
        </header>
        <div class="modal-body">
            <p class="modal-desc">
                اختر الحقول المطلوب إظهارها في بطاقات الطلاب:
            </p>
            <div class="settings-checklist">
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_تسميع" onchange="updateFieldVisibility()">
                    <span>التسميع</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_ماضي_قريب" onchange="updateFieldVisibility()">
                    <span>الماضي القريب</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_مراجعة_قديمة" onchange="updateFieldVisibility()">
                    <span>الماضي البعيد</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_حفظ" onchange="updateFieldVisibility()">
                    <span>الحفظ الجديد</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_ماضي_قريب_جديد" onchange="updateFieldVisibility()">
                    <span>الماضي القريب المطلوب</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_مراجعة" onchange="updateFieldVisibility()">
                    <span>الماضي البعيد المطلوب</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_ملاحظات" onchange="updateFieldVisibility()">
                    <span>ملاحظات المعلم</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="vis_وسام" onchange="updateFieldVisibility()">
                    <span>الوسام</span>
                </label>
                <hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">
                <label class="checkbox-label" style="color:var(--primary);">
                    <input type="checkbox" id="vis_quran_picker" onchange="updateFieldVisibility()">
                    <span>أزرار منتقي المصحف (📖)</span>
                </label>
            </div>

            <hr class="modal-divider">
            
            <div class="settings-section-title">📁 إدارة المسودات:</div>
            <div class="draft-modal-actions">
                <button type="button" onclick="createNewDraftPrompt()" class="btn btn-outline btn-sm" aria-label="مسودة جديدة">+ مسودة جديدة</button>
                <button type="button" onclick="renameCurrentDraftPrompt()" class="btn btn-outline btn-sm" aria-label="إعادة تسمية">✏️ إعادة تسمية</button>
                <button type="button" onclick="deleteCurrentDraftConfirm()" class="btn btn-outline btn-sm btn-danger-outline" aria-label="حذف المسودة">🗑️ حذف المسودة</button>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" onclick="resetFieldVisibility()" class="btn btn-outline btn-sm" style="margin-left:auto;">إظهار الكل</button>
            <button type="button" onclick="closeSettingsModal()" class="btn btn-success btn-sm">تم ✓</button>
        </footer>
    </div>
</div>

</body>
</html>
